include classpath("application.conf")
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}
rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = relaxed
}
aws {
  region = us-east-1
  accountId = "000000000000"
}
queues {
  inference-jobs {
    defaultVisibilityTimeout = 180 seconds
    delay = 0 seconds
    receiveMessageWait = 10 seconds
  }
  report-jobs {
    defaultVisibilityTimeout = 120 seconds
    delay = 0 seconds
    receiveMessageWait = 10 seconds
  }
}
